name: Temporary Jekyll build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify generated pages
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/publications/index.html
          grep -Fq "Junteng Liu" _site/index.html
          grep -Fq "jliugi@connect.ust.hk" _site/index.html
          grep -Fq "Vicent0205" _site/index.html
          grep -Fq "tbK9jl4AAAAJ" _site/index.html
          grep -Fq "junteng88716710" _site/index.html
          grep -Fq "MINIMAX" _site/index.html
          grep -Fq "Tencent WXG" _site/index.html
          grep -Fq "Shanghai AI Lab" _site/index.html
          grep -Fq "Zhiyuan Honor Scholarship" _site/index.html
          titles=(
            "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond"
            "On the Perception Bottleneck of VLMs for Chart Understanding"
            "On the Universal Truthfulness Hyperplane Inside LLMs"
            "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation"
            "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models"
            "Composing Parameter-Efficient Modules with Arithmetic Operations"
          )
          for title in "${titles[@]}"; do
            grep -Fq "$title" _site/index.html
            grep -Fq "$title" _site/publications/index.html
          done
          if grep -R -Fq "Paper Title Number" _site; then
            echo "Sample publication content was generated" >&2
            exit 1
          fi
          for removed_path in cv talks teaching portfolio year-archive talkmap terms non-menu-page archive-layout-with-content; do
            test ! -e "_site/${removed_path}/index.html"
            test ! -e "_site/${removed_path}.html"
          done
          echo "Generated top-level pages:"
          find _site -maxdepth 2 -name index.html | sort
